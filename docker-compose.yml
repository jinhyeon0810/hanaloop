services:
  db:
    image: postgres:16-alpine
    container_name: hanaloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanaloop
      POSTGRES_PASSWORD: hanaloop
      POSTGRES_DB: hanaloop
      TZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - hanaloop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanaloop -d hanaloop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hanaloop-db:
